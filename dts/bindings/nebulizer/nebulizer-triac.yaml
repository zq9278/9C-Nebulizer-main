description: TRIAC timing resources for the nebulizer heater stage

compatible: "ninec,nebulizer-triac"

include: base.yaml

properties:
  enable-gpios:
    type: phandle-array
    required: true
  zcd-gpios:
    type: phandle-array
    required: true
  counter:
    type: phandle
    required: true
  label:
    type: string
    required: false
  pulse-width-us:
    type: int
    required: true
  default-delay-us:
    type: int
    required: true
