description: NTC input descriptor for the nebulizer board

compatible: "ninec,nebulizer-ntc"

include: base.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
  label:
    type: string
    required: false
  pullup-ohms:
    type: int
    required: true
  nominal-ohms:
    type: int
    required: true
  beta:
    type: int
    required: true
  nominal-temp-c:
    type: int
    required: true
